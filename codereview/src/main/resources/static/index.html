<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Review Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen font-sans flex flex-col overflow-hidden">

<header class="bg-blue-600 text-white p-4 shadow-md text-center shrink-0">
    <h1 class="text-2xl font-bold">AI Code Review Assistant</h1>
    <p class="mt-1 opacity-80 text-sm">Paste your code below for an instant review</p>
</header>

<main class="flex-1 w-full p-4 grid grid-cols-1 lg:grid-cols-4 gap-4 overflow-hidden">

    <div class="bg-white p-4 rounded-lg shadow-md flex flex-col h-full lg:col-span-1">

        <div class="flex justify-between items-center mb-3 shrink-0">
            <h2 class="text-lg font-semibold text-gray-700">Source Code</h2>
            <select id="languageSelect" class="text-sm bg-gray-50 border border-gray-300 text-gray-700 rounded cursor-pointer py-1 px-2 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                <option value="java" selected>Java</option>
                <option value="python">Python</option>
                <option value="javascript">JavaScript (React/Node)</option>
                <option value="solidity">Solidity</option>
                <option value="cpp">C++</option>
            </select>
        </div>

        <textarea id="codeInput" class="flex-1 w-full p-4 border rounded-md font-mono text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none whitespace-pre" spellcheck="false" placeholder="Paste your code here..."></textarea>

        <button id="analyzeBtn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-md transition duration-200 flex justify-center items-center shrink-0">
            <span id="btnText">Analyze Code</span>
            <svg id="loadingSpinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </div>

    <div class="bg-white p-4 rounded-lg shadow-md flex flex-col h-full overflow-hidden lg:col-span-3">
        <h2 class="text-lg font-semibold mb-3 text-gray-700 shrink-0">Review Results</h2>

        <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar relative">

            <div id="emptyState" class="text-gray-400 text-center mt-10 h-full flex items-center justify-center">
                <p>Run the analysis to see issues and improved code here.</p>
            </div>

            <div id="skeletonLoader" class="hidden flex-col gap-4 w-full h-full pb-4">
                <div>
                    <div class="h-5 bg-gray-200 rounded w-32 mb-4 animate-pulse"></div>
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                        <div class="bg-gray-50 border-l-4 border-gray-300 p-4 rounded shadow-sm flex flex-col gap-3 animate-pulse h-full">
                            <div class="h-5 bg-gray-200 rounded w-16 mb-1"></div>
                            <div class="h-4 bg-gray-200 rounded w-full"></div>
                            <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                            <div class="h-10 bg-gray-200 rounded w-full mt-2"></div>
                        </div>
                        <div class="bg-gray-50 border-l-4 border-gray-300 p-4 rounded shadow-sm flex flex-col gap-3 animate-pulse h-full">
                            <div class="h-5 bg-gray-200 rounded w-16 mb-1"></div>
                            <div class="h-4 bg-gray-200 rounded w-full"></div>
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="h-10 bg-gray-200 rounded w-full mt-2"></div>
                        </div>
                    </div>
                </div>
                <div class="mt-6">
                    <div class="flex justify-between items-center border-b pb-2 mb-4">
                        <div class="h-5 bg-gray-200 rounded w-32 animate-pulse"></div>
                        <div class="h-6 bg-gray-200 rounded w-24 animate-pulse"></div> </div>
                    <div class="bg-gray-800 p-4 rounded-md animate-pulse w-full flex flex-col gap-3">
                        <div class="h-4 bg-gray-600 rounded w-1/2"></div>
                        <div class="h-4 bg-gray-600 rounded w-1/3 ml-4"></div>
                        <div class="h-4 bg-gray-600 rounded w-1/4 ml-8"></div>
                        <div class="h-4 bg-gray-600 rounded w-2/5 ml-4"></div>
                        <div class="h-4 bg-gray-600 rounded w-1/5"></div>
                    </div>
                </div>
            </div>

            <div id="issuesContainer" class="hidden flex-col gap-4">
                <h3 class="font-bold text-red-600 border-b pb-2">Identified Issues</h3>
                <div id="issuesList" class="grid grid-cols-1 xl:grid-cols-2 gap-4"></div>
            </div>

            <div id="improvedCodeContainer" class="hidden mt-6 flex-col gap-2">
                <div class="flex justify-between items-center border-b pb-2">
                    <h3 class="font-bold text-green-600">Improved Code</h3>
                    <button id="copyBtn" class="text-xs bg-gray-50 hover:bg-gray-200 text-gray-700 font-semibold px-3 py-1.5 rounded transition duration-200 flex items-center border border-gray-300">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <span>Copy Code</span>
                    </button>
                </div>
                <pre class="bg-gray-800 text-green-400 p-4 rounded-md overflow-x-auto text-sm font-mono"><code id="improvedCodeOutput"></code></pre>
            </div>
        </div>
    </div>
</main>

<script>
    // --- Copy Button Logic ---
    document.getElementById('copyBtn').addEventListener('click', async () => {
        const codeText = document.getElementById('improvedCodeOutput').textContent;
        const copyBtn = document.getElementById('copyBtn');

        try {
            await navigator.clipboard.writeText(codeText);
            const originalHTML = copyBtn.innerHTML;
            copyBtn.innerHTML = `
                <svg class="w-4 h-4 mr-1 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span class="text-green-600">Copied!</span>
            `;
            copyBtn.classList.replace('bg-gray-50', 'bg-green-50');
            copyBtn.classList.replace('border-gray-300', 'border-green-200');

            setTimeout(() => {
                copyBtn.innerHTML = originalHTML;
                copyBtn.classList.replace('bg-green-50', 'bg-gray-50');
                copyBtn.classList.replace('border-green-200', 'border-gray-300');
            }, 2000);
        } catch (err) {
            console.error('Failed to copy code: ', err);
            alert("Failed to copy code to clipboard.");
        }
    });

    // --- Analyze Button Logic ---
    document.getElementById('analyzeBtn').addEventListener('click', async () => {
        const codeInput = document.getElementById('codeInput').value;
        const languageInput = document.getElementById('languageSelect').value;

        if (!codeInput.trim()) {
            alert("Please paste some code first!");
            return;
        }

        const btn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        const emptyState = document.getElementById('emptyState');
        const skeletonLoader = document.getElementById('skeletonLoader');
        const issuesContainer = document.getElementById('issuesContainer');
        const improvedCodeContainer = document.getElementById('improvedCodeContainer');
        const issuesList = document.getElementById('issuesList');
        const improvedCodeOutput = document.getElementById('improvedCodeOutput');

        // UI State: Loading
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        btnText.innerText = "Analyzing...";
        spinner.classList.remove('hidden');

        emptyState.classList.add('hidden');
        issuesContainer.classList.add('hidden');
        improvedCodeContainer.classList.add('hidden');
        skeletonLoader.classList.remove('hidden'); // Show updated skeleton
        skeletonLoader.classList.add('flex');
        issuesList.innerHTML = '';

        try {
            const response = await fetch('http://localhost:8080/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    language: languageInput,
                    code: codeInput
                })
            });

            if (!response.ok) throw new Error("API returned an error");

            const data = await response.json();

            skeletonLoader.classList.add('hidden');
            skeletonLoader.classList.remove('flex');

            if (data.issues && data.issues.length > 0) {
                data.issues.forEach(issue => {
                    const issueCard = document.createElement('div');
                    issueCard.className = "bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm text-sm h-full flex flex-col";
                    issueCard.innerHTML = `
                        <div>
                            <p class="font-bold text-gray-800 border-b border-red-200 pb-1 mb-2 inline-block">Line ${issue.line}</p>
                            <p class="text-red-800 mb-3"><strong>Problem:</strong> ${issue.problem}</p>
                        </div>
                        <p class="text-green-800 bg-green-50 p-2 rounded border border-green-100 mt-auto"><strong>Fix:</strong> ${issue.suggestion}</p>
                    `;
                    issuesList.appendChild(issueCard);
                });
                issuesContainer.classList.remove('hidden');
                issuesContainer.classList.add('flex');
            }

            if (data.improvedCode) {
                improvedCodeOutput.textContent = data.improvedCode;
                improvedCodeContainer.classList.remove('hidden');
                improvedCodeContainer.classList.add('flex');
            }

            if (!data.issues?.length && !data.improvedCode) {
                emptyState.innerHTML = "<p class='text-green-500 font-bold'>No issues found! Your code looks great.</p>";
                emptyState.classList.remove('hidden');
            }

        } catch (error) {
            console.error("Error:", error);
            skeletonLoader.classList.add('hidden');
            skeletonLoader.classList.remove('flex');
            emptyState.innerHTML = "<p class='text-red-500'>Failed to analyze code. Make sure your Spring Boot backend is running.</p>";
            emptyState.classList.remove('hidden');
        } finally {
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            btnText.innerText = "Analyze Code";
            spinner.classList.add('hidden');
        }
    });
</script>
</body>
</html>
